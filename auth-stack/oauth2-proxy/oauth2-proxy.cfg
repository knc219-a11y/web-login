## oauth2-proxy 설정 (Keycloak OIDC)
## 주소(PUBLIC_URL)에 따라 바뀌는 값과 비밀값은 docker-compose.yml 의 환경변수(OAUTH2_PROXY_*)로 넣습니다.
## 참고: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview

http_address = "0.0.0.0:4180"
reverse_proxy = true                 # HAProxy 뒤에 있으므로 X-Forwarded-* 신뢰

## --- Keycloak ---
provider = "keycloak-oidc"
client_id = "oauth2-proxy"
code_challenge_method = "S256"       # PKCE
scope = "openid profile email"

## 브라우저는 공개 주소(PUBLIC_URL)로 Keycloak 에 가고, 토큰 교환/서명키 조회는 컨테이너 내부 주소로 합니다.
## (issuer 는 공개 주소라 discovery 를 끄고 엔드포인트를 직접 지정)
skip_oidc_discovery = true
redeem_url = "http://keycloak:8080/auth/realms/kibana/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/auth/realms/kibana/protocol/openid-connect/certs"
validate_url = "http://keycloak:8080/auth/realms/kibana/protocol/openid-connect/userinfo"
profile_url = "http://keycloak:8080/auth/realms/kibana/protocol/openid-connect/userinfo"

## TODO: 특정 메일 도메인/그룹만 허용하려면 수정.
##   예) email_domains = ["example.co.kr"]  /  allowed_groups = ["/kibana-users"]
email_domains = ["*"]
insecure_oidc_allow_unverified_email = true

## 로그인 버튼 화면 없이 바로 Keycloak 로그인으로 이동
skip_provider_button = true

## 로그인/로그아웃 후 이동 허용 도메인 (Open Redirect 방지). TODO: 내부망 도메인으로 변경
whitelist_domains = ["localhost:*"]

## --- 세션 ---
cookie_name = "_kibana_auth"
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "5m"                # Keycloak 에서 계정을 막으면 5분 안에 반영
session_store_type = "redis"
redis_connection_url = "redis://redis:6379"

## --- Kibana 로 넘기는 헤더 ---
## X-Forwarded-User / X-Forwarded-Email / X-Forwarded-Preferred-Username 전달
pass_user_headers = true
## Authorization 헤더는 건드리지 않음 (Kibana 계정 주입은 auth-stack/README.md "Kibana 이중 로그인" 참고)
pass_basic_auth = false
pass_access_token = false
pass_authorization_header = false
