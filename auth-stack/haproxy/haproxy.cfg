# HAProxy: 외부 진입점
#   /auth/**  → Keycloak (로그인 화면, 관리 콘솔)
#   /logout   → oauth2-proxy 세션 삭제 후 Keycloak 로그아웃
#   /         → 기본 Kibana 화면으로 리다이렉트
#   그 외     → oauth2-proxy (로그인 확인 후 Kibana 로 전달)
#
# TODO(내부망): HTTPS 적용
#   bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem
#   http-request redirect scheme https unless { ssl_fc }
#   그리고 .env 의 PUBLIC_URL 을 https://... 로, OAUTH2_PROXY_COOKIE_SECURE=true 로 변경

global
    log stdout format raw local0

# Docker 내부 DNS. 뒤쪽 서비스가 늦게 떠도 HAProxy 가 먼저 기동되도록 함
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    log     global
    default-server init-addr last,libc,none resolvers docker
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend web
    bind :8080
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http  if !{ ssl_fc }

    # TODO: Keycloak 관리 콘솔을 관리자 PC 대역에서만 열려면
    # http-request deny if { path_beg /auth/admin } !{ src 10.0.0.0/8 }

    # TODO: 로그인 후 기본으로 열 Kibana 화면
    http-request redirect location /kibana/app/home code 302 if { path / }

    # 로그아웃: oauth2-proxy 세션 삭제 → Keycloak 로그아웃 → 다시 Kibana(=로그인 화면)
    http-request redirect location "/oauth2/sign_out?rd=${PUBLIC_URL}%%2Fauth%%2Frealms%%2Fkibana%%2Fprotocol%%2Fopenid-connect%%2Flogout%%3Fclient_id%%3Doauth2-proxy%%26post_logout_redirect_uri%%3D${PUBLIC_URL}%%2Fkibana%%2Fapp%%2Fhome" code 302 if { path /logout }

    use_backend keycloak if { path_beg /auth/ }
    default_backend oauth2_proxy

backend keycloak
    server keycloak keycloak:8080 check inter 10s

backend oauth2_proxy
    # TODO: 여러 대로 운영 시 server 줄 추가 (세션이 Redis 에 있으므로 어느 쪽으로 가도 됨)
    server oauth2-proxy-1 oauth2-proxy:4180 check inter 10s
