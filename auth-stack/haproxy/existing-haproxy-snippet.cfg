# =============================================================
# 기존(사내) HAProxy 에 추가할 설정 조각  ← 인프라 담당자에게 전달용
# =============================================================
# 이 저장소의 haproxy/haproxy.cfg 는 로컬 테스트용입니다. 운영에서는 이미 있는 HAProxy 에
# 아래 내용만 추가하면 됩니다. 주소/도메인은 TODO 부분을 실제 값으로 바꾸세요.
#
#   TODO: kibana.example.co.kr    → 사용자가 접속할 도메인 (.env 의 PUBLIC_URL 과 같아야 함)
#   TODO: 10.0.0.20:8080          → Keycloak 서버 (auth-stack 이 떠 있는 서버)
#   TODO: 10.0.0.20:8081          → Spring 게이트웨이 서버
#
# 필요한 것은 딱 세 가지입니다.
#   1) /auth/**   → Keycloak
#   2) 나머지     → Spring 게이트웨이  (Kibana 로 직접 보내지 않음)
#   3) X-Forwarded-For / X-Forwarded-Proto 헤더 전달, Host 헤더 유지
# 그리고 Kibana(5601) 로 직접 가는 기존 라우트가 있다면 제거해야 로그인을 우회할 수 없습니다.

# ---- 기존 frontend (https) 안에 추가 ----
#   option forwardfor
#   http-request set-header X-Forwarded-Proto https
#   http-request set-header X-Forwarded-Host %[req.hdr(host)]
#
#   acl host_kibana  hdr(host) -i kibana.example.co.kr
#   acl path_auth    path_beg /auth/
#
#   # (선택) 첫 화면 리다이렉트
#   http-request redirect location /kibana/app/home code 302 if host_kibana { path / }
#
#   # (선택) Keycloak 관리 콘솔은 관리자 대역에서만
#   http-request deny if host_kibana { path_beg /auth/admin } !{ src 10.0.0.0/8 }
#
#   use_backend be_keycloak     if host_kibana path_auth
#   use_backend be_kibana_gw    if host_kibana

# ---- backend 추가 ----
#   backend be_keycloak
#       server keycloak 10.0.0.20:8080 check
#
#   backend be_kibana_gw
#       option httpchk GET /actuator/health
#       server gateway 10.0.0.20:8081 check
