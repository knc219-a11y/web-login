# Keycloak + PostgreSQL + Spring 게이트웨이(gateway/) + Redis + HAProxy  (앞단 로그인 → Kibana)
#
#   브라우저 ─▶ HAProxy(:PUBLIC_PORT)
#                ├─ /auth/**   ─▶ Keycloak ─▶ PostgreSQL
#                └─ 그 외      ─▶ gateway(Spring) ─(세션: Redis)─▶ Kibana
#
# 로컬 테스트 (HAProxy, Mock Kibana 포함):
#   (cd gateway && mvn -DskipTests package)      ← 게이트웨이 jar 빌드
#   cp .env.example .env && docker compose --profile local up -d --build
#   http://localhost:8000/kibana/app/discover  (테스트 계정 admin / admin123)
#
# 운영 (사내에 이미 있는 HAProxy 사용):
#   docker compose up -d --build     ← keycloak, postgres, gateway, redis 만 기동
#   기존 HAProxy 에는 haproxy/existing-haproxy-snippet.cfg 내용만 추가

services:
  # 로컬 테스트용. 운영은 사내 기존 HAProxy 사용 (haproxy/existing-haproxy-snippet.cfg)
  haproxy:
    profiles: ["local"]
    image: haproxy:3.0-alpine
    ports:
      - "${PUBLIC_PORT:-8000}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - keycloak
      - gateway
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start", "--import-realm"]
    ports:
      # 기존 HAProxy 가 접근하는 포트. TODO: 방화벽으로 HAProxy 서버에서만 접근 허용
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # 브라우저가 보는 주소. 토큰의 issuer 도 이 주소가 됨
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      # 게이트웨이가 컨테이너 내부 주소(keycloak:8080)로 토큰을 받을 수 있게 허용
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # TLS 는 HAProxy 에서 처리 (TODO: 내부망에서 HAProxy 에 인증서 적용)
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # keycloak/realm-kibana.json 안의 ${...} 값 치환용
      PUBLIC_URL: ${PUBLIC_URL}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-kibana.json:/opt/keycloak/data/import/realm-kibana.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # TODO: 내부망에 기존 PostgreSQL 이 있으면 이 서비스는 제거하고 .env 의 KC_DB_URL 변경
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Spring Boot 게이트웨이 (gateway/ 폴더, IntelliJ 로 열어서 수정)
  gateway:
    build: ./gateway
    ports:
      # 기존 HAProxy 가 접근하는 포트. TODO: 방화벽으로 HAProxy 서버에서만 접근 허용
      - "8081:8081"
    environment:
      KEYCLOAK_REALM_URL: ${PUBLIC_URL}/auth/realms/kibana
      KEYCLOAK_INTERNAL_REALM_URL: http://keycloak:8080/auth/realms/kibana
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET}
      KIBANA_URL: ${KIBANA_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
      REDIS_HOST: redis
    depends_on:
      - keycloak
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # 임시 Kibana (로컬 테스트용, 운영에서는 안 뜸). TODO: 운영은 .env 의 KIBANA_URL 을 실제 Kibana 로 변경
  mock-kibana:
    profiles: ["local"]
    image: node:20-alpine
    command: ["node", "/app/server.js"]
    volumes:
      - ./mock-kibana/server.js:/app/server.js:ro
    restart: unless-stopped

volumes:
  pgdata:
