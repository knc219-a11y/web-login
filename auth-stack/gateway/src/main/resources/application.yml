# =============================================================
# kibana-gateway 설정
# ${환경변수:기본값} 형태. 운영 값은 환경변수(auth-stack/.env)로 넣습니다.
# IntelliJ 에서 바로 실행할 때는 기본값(localhost)으로 동작합니다.
# =============================================================

server:
  port: ${GATEWAY_PORT:8081}
  # 앞단 HAProxy 의 X-Forwarded-Proto/Host 를 믿고 리다이렉트 주소를 만듦
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        name: KIBANA_GW_SESSION
        http-only: true
        same-site: lax
        # TODO: HTTPS 운영 시 true
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: kibana-gateway
  data:
    redis:
      # TODO: 내부망 Redis 주소
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    redis:
      namespace: kibana-gateway:session

app:
  # TODO: 내부망 실제 Kibana 주소 (Kibana 의 server.basePath 가 /kibana 여야 함)
  kibana-url: ${KIBANA_URL:http://localhost:5601}
  kibana-path: /kibana
  # TODO: 로그인 후 기본으로 열 Kibana 화면
  default-redirect: ${DEFAULT_REDIRECT:/kibana/app/home}
  keycloak:
    # TODO: 브라우저가 접속하는 Keycloak 주소 (PUBLIC_URL + /auth/realms/kibana)
    realm-url: ${KEYCLOAK_REALM_URL:http://localhost:8000/auth/realms/kibana}
    # 게이트웨이 서버에서 Keycloak 으로 직접 접속하는 주소. realm-url 로 접속 가능하면 같은 값.
    internal-realm-url: ${KEYCLOAK_INTERNAL_REALM_URL:${app.keycloak.realm-url}}
    client-id: ${GATEWAY_CLIENT_ID:kibana-gateway}
    # TODO: Keycloak 클라이언트 비밀값 (auth-stack/.env 의 GATEWAY_CLIENT_SECRET 과 동일)
    client-secret: ${GATEWAY_CLIENT_SECRET:change-me-client-secret}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    # 접속 로그를 보고 싶으면 DEBUG
    com.weblogin.gateway: INFO
